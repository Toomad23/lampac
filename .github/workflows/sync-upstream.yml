name: Sync from upstream

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/lampac-talks/Lampac.git
          git fetch upstream main

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet HEAD upstream/main; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create sync branch and merge
        if: steps.diff.outputs.changed == 'true'
        run: |
          DATE=$(date -u +%Y%m%d)
          BRANCH="sync/upstream-$DATE"
          git checkout -B "$BRANCH"
          if ! git merge --no-edit upstream/main; then
            echo "MERGE_CONFLICT=true" >> "$GITHUB_ENV"
            git merge --abort || true
            # Create branch with a marker commit instead of silently discarding upstream
            git commit --allow-empty -m "sync: upstream $DATE (conflicts — manual merge required)"
          fi
          git push origin "$BRANCH" --force-with-lease
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="sync: upstream $(date -u +%Y-%m-%d)"
          BODY="Automated sync from lampac-talks/Lampac main."
          if [ "${MERGE_CONFLICT:-}" = "true" ]; then
            BODY="$BODY\n\n⚠️ Merge conflicts — resolve manually before merging."
          fi
          gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY" || \
            gh pr edit "$BRANCH" --title "$TITLE" --body "$BODY" || true
